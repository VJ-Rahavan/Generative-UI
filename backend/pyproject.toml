[project]
name = "genui"
version = "0.1.0"
description = "FitGen — a generative UI fitness coach (FastAPI + Groq)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "groq>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "langchain-core>=1.6",
    "langchain-groq>=1.1",
    "langsmith>=0.4",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
genui = "genui.main:run"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Static reference data table
"src/genui/domain/fitness/exercises.py" = ["E501"]
